[package]
name = "pasori"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NFC card protocols for PaSoRi readers, run over the RC-S956, RC-S310, Port-100, Port-110 and Port-400 reader layers"

[features]
felica-lite-s = ["dep:des", "dep:subtle", "dep:zeroize"]
felica-standard-aes = ["dep:aes", "dep:cmac", "dep:subtle", "dep:zeroize"]
felica-standard-des = ["dep:cbc", "dep:des", "dep:subtle", "dep:zeroize"]

[dependencies]
felica-packet = { path = "../felica-packet", version = "0.1" }
iso14443 = { path = "../iso14443", version = "0.1" }
port100 = { path = "../port100", version = "0.1" }
port110 = { path = "../port110", version = "0.1" }
port400 = { path = "../port400", version = "0.1" }
rcs310 = { path = "../rcs310", version = "0.1" }
rcs956 = { path = "../rcs956", version = "0.1" }
aes = { version = "0.9", features = ["zeroize"], optional = true }
cbc = { version = "0.2", features = ["zeroize"], optional = true }
cmac = { version = "0.8", features = ["zeroize"], optional = true }
des = { version = "0.9", features = ["zeroize"], optional = true }
subtle = { version = "2.6", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
reader-script = { path = "../script" }

[lints]
workspace = true
